<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeLab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <h2 class="logo">CodeLab</h2>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#courses">Courses</a>
            <a href="#contact">Contact</a>
        </nav>

        <a href="#signup" class="button signup-button">
            Sign up
        </a>

    </header>


    <!-- Hero Section -->
    <main>

        <section class="hero">

            <h1>Learn Web Development</h1>

            <p>Start from zero. Build real projects.</p>

            <a href="#courses" class="button get-started-button">
                Get started
            </a>

        </section>


        <!-- Courses Section -->
        <section class="courses" id="courses">

            <article class="course-card">
                <h2>HTML</h2>
                <p>Build the structure</p>
            </article>

            <article class="course-card">
                <h2>CSS</h2>
                <p>Make it beautiful</p>
            </article>

            <article class="course-card">
                <h2>JavaScript</h2>
                <p>Make it smart</p>
            </article>

            <article class="course-card">
                <h2>Git</h2>
                <p>Save your work</p>
            </article>

        </section>

    </main>

</body>
</html>
